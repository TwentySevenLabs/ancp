[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancp"
version = "1.0.0"
description = "Agent Native Compiler Protocol reference CLI, validator, and native-tool adapters."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "ANCP contributors" }
]
keywords = [
  "agent",
  "compiler",
  "diagnostics",
  "schema",
  "lsp",
  "static-analysis",
  "repair"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
  "jsonschema>=4.22.0",
  "PyYAML>=6.0.0",
  "tomli>=2.0.0; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "twine>=5.0.0"
]

[project.urls]
Homepage = "https://agent-native-compiler-protocol.org"
Repository = "https://github.com/agent-native-compiler-protocol/ancp"
Documentation = "https://agent-native-compiler-protocol.org/docs"

[project.scripts]
ancp = "ancp.cli:main"
ancp-validate = "ancp.cli:validate_main"
ancp-tsc = "ancp.proxy:tsc_main"
ancp-eslint = "ancp.proxy:eslint_main"
ancp-pyright = "ancp.proxy:pyright_main"
ancp-ruff = "ancp.proxy:ruff_main"
ancp-python = "ancp.proxy:python_main"
ancp-cargo = "ancp.proxy:cargo_main"
ancp-rustc = "ancp.proxy:rustc_main"
ancp-go = "ancp.proxy:go_main"
ancp-gcc = "ancp.proxy:gcc_main"
ancp-clang = "ancp.proxy:clang_main"
ancp-javac = "ancp.proxy:javac_main"
ancp-kotlinc = "ancp.proxy:kotlinc_main"
ancp-dotnet = "ancp.proxy:dotnet_main"
ancp-swift = "ancp.proxy:swift_main"
ancp-zig = "ancp.proxy:zig_main"
ancp-ruby = "ancp.proxy:ruby_main"
ancp-php = "ancp.proxy:php_main"
ancp-dart = "ancp.proxy:dart_main"
ancp-scala-cli = "ancp.proxy:scala_cli_main"
ancp-scalac = "ancp.proxy:scalac_main"
ancp-julia = "ancp.proxy:julia_main"
ancp-shellcheck = "ancp.proxy:shellcheck_main"
ancp-bash = "ancp.proxy:bash_main"
ancp-pwsh = "ancp.proxy:pwsh_main"
ancp-powershell = "ancp.proxy:powershell_main"
ancp-luac = "ancp.proxy:luac_main"
ancp-lua = "ancp.proxy:lua_main"
ancp-perl = "ancp.proxy:perl_main"
ancp-rscript = "ancp.proxy:rscript_main"
ancp-ghc = "ancp.proxy:ghc_main"
ancp-ocamlc = "ancp.proxy:ocamlc_main"
ancp-erlc = "ancp.proxy:erlc_main"
ancp-elixirc = "ancp.proxy:elixirc_main"
ancp-clj-kondo = "ancp.proxy:clj_kondo_main"
ancp-nix-instantiate = "ancp.proxy:nix_instantiate_main"
ancp-terraform = "ancp.proxy:terraform_main"
ancp-hadolint = "ancp.proxy:hadolint_main"
ancp-sqlfluff = "ancp.proxy:sqlfluff_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ancp = [
  "resources/schemas/*.json",
  "resources/taxonomies/*.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
